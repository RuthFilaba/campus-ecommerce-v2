services:
  - type: web
    name: campus-ecom-api
    runtime: python
    repo: https://github.com/RuthFilaba/campus-ecommerce-v2
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn backend.campus_config.wsgi:application
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: backend.campus_config.settings
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: False
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://campus-ecommerce-v2.vercel.app
