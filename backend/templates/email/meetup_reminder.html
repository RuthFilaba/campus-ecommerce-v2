<!DOCTYPE html>
<html>
<head>
    <title>Meetup Reminder - Campus E-Commerce</title>
</head>
<body>
    <h1>Meetup Reminder</h1>
    <p>Hello {{ buyer_name }} and {{ seller_name }},</p>
    <p>This is a reminder for your meetup regarding <strong>{{ product_name }}</strong>.</p>
    <p><strong>Location:</strong> {{ meetup_location }}</p>
    <p><strong>Time:</strong> {{ meetup_time }}</p>
    <p>Please be on time and stay safe!</p>
    <p>Best regards,<br>Campus E-Commerce Team</p>
</body>
</html>
