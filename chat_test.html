<!DOCTYPE html>
<html>
<head>
    <title>Chat Test</title>
    <style>
        body { font-family: Arial; padding: 20px; }
        #messages { border: 1px solid #ccc; height: 300px; overflow-y: scroll; padding: 10px; margin-bottom: 10px; }
        .message { margin-bottom: 10px; }
        .my-message { text-align: right; color: blue; }
        .other-message { text-align: left; color: green; }
        .typing { color: gray; font-style: italic; }
        input { width: 80%; padding: 10px; }
        button { padding: 10px; }
    </style>
</head>
<body>
    <h2>Chat Test - Thread ID: <span id="threadId">1</span></h2>
    <div id="messages"></div>
    <div id="typing-indicator" class="typing"></div>
    <input type="text" id="messageInput" placeholder="Type a message...">
    <button onclick="sendMessage()">Send</button>
    
    <script>
        const threadId = 1;
        const token = prompt("Enter your JWT token:");
        
        const ws = new WebSocket(`ws://localhost:8000/ws/chat/${threadId}/?token=${token}`);
        
        ws.onopen = function() {
            addMessage("System", "Connected to chat!", "system");
        };
        
        ws.onmessage = function(event) {
            const data = JSON.parse(event.data);
            
            if (data.type === 'message') {
                const sender = data.is_mine ? "Me" : data.sender_name;
                const className = data.is_mine ? "my-message" : "other-message";
                addMessage(sender, data.message, className);
            } else if (data.type === 'typing') {
                if (data.is_typing) {
                    document.getElementById('typing-indicator').innerHTML = `${data.user_name} is typing...`;
                } else {
                    document.getElementById('typing-indicator').innerHTML = '';
                }
            }
        };
        
        ws.onclose = function() {
            addMessage("System", "Disconnected from chat", "system");
        };
        
        function addMessage(sender, message, className) {
            const messagesDiv = document.getElementById('messages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${className}`;
            messageDiv.innerHTML = `<strong>${sender}:</strong> ${message}`;
            messagesDiv.appendChild(messageDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }
        
        function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value;
            if (message) {
                ws.send(JSON.stringify({ type: 'message', message: message }));
                input.value = '';
            }
        }
        
        document.getElementById('messageInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
        
        let typingTimeout;
        document.getElementById('messageInput').addEventListener('input', function() {
            ws.send(JSON.stringify({ type: 'typing', is_typing: true }));
            clearTimeout(typingTimeout);
            typingTimeout = setTimeout(() => {
                ws.send(JSON.stringify({ type: 'typing', is_typing: false }));
            }, 1000);
        });
    </script>
</body>
</html>
